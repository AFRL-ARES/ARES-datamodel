syntax = "proto3";

package ares.datamodel.templates;

import "templates/command_template.proto";
import "templates/execution_node.proto";

message StepTemplate {
  optional string unique_id = 1; // A unique id for this template
	string name = 2; // Name identification
	bool is_parallel = 3; // Flag indicating whether or not commands are to be executed sequentially or in parallel
	repeated CommandTemplate command_templates = 4 [deprecated = true]; // Collection of (unqualified) command templates used to generate executable (device qualified) commands
	int64 index = 5; // Index of the collection in which executed this template
	repeated ExecutionNode execution_nodes = 6; // A replacement for the old command templates that includes those command templates as well as other import types of execution nodes
}

