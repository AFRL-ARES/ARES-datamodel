syntax = "proto3";

package ares.datamodel.planning;

import "ares_struct.proto";
import "ares_data_type.proto";
import "ares_outcome_enum.proto";
import "request_metadata.proto";
import "analyzing/analysis.proto";

//A collection of messages relevant to the planning process
message PlanningRequest {
  repeated planning.PlanningParameter planning_parameters = 1; // The parameters ARES is requesting the service to plan for
  AresStruct adapter_settings = 2; // The settings associated with this plan request
  repeated double analysis_results = 3 [deprecated = true]; // Deprecated analysis result field, to be removed in a future major version release 
  RequestMetadata metadata = 4; // Metadata providing additional context from ARES
  repeated PlanStatusCode previous_plan_status_codes = 5; // A collection of status codes that matches the outcome from the previously planned experiments
  int32 batch_size = 6; // The number of plans being requested from this planner
  repeated AnalysisData analysis_data = 7; // A collection of data from the analyzer
}

message PlanningResponse {
  reserved 1, 2, 3; // Reserve deprecated field numbers to avoid compatability issues
  reserved "planned_parameters", "planning_outcome", "error_string"; // Reserve deprecated field names to avoid compatability issues

  repeated Plan plans = 4; // A collection of plans returned from the planner
  ObjectiveStatus objective_status = 5; // Signals whether or not the objective has been achieved, can be used to determine when an experiment should stop
}

// Leaving this as a standalone message for the possibility of future expansion (including various non-planner related inputs and outputs, for example)
message AnalysisData {
  repeated analyzing.Objective analysis_objectives = 1; // The determined objective values from the analyzer
}

message Plan {
  repeated planning.PlannedParameter planned_parameters = 1; // A complete collection of planned parameters needed to conduct an experiment
  Outcome planning_outcome = 2; // The outcome of this planning attempt, indicates whether or not the planning proccess was successful
  optional string error_string = 3; // Optional string for defining errors in the planning process
}

message PlanningParameter {
  string parameter_name = 1; // Name descriptor of the parameter
  optional double minimum_value = 2; // The minimum value that can be associated with the parameter
  optional double maximum_value = 3; // The maximum value that can be associated with the parameter
  optional double minimum_precision = 4; // The minimum precision associated with the parameter
  repeated ParameterHistoryInfo parameter_history = 5; // Previous values used for the parameter
  AresDataType data_type = 6; // The data type of the parameter
  PlannerMetadata metadata = 7; // Metadata associated with the parameter
  bool is_planned = 8; // Set based on whether the parameter should be planned for
  bool is_result = 9; // Set based on whether the parameter is designed as the result of the experiment
  string planner_name = 10; // The planner requested to plan for the parameter
  optional AresValue initial_value = 11; // An optional initial value for the planner to use for this parameter
}

message ParameterHistoryInfo {
  AresValue planned_value = 1; // the value that was planned
  optional AresValue achieved_value = 2; // optionally the value that was achieved for the planned value
}

message PlannedParameter {
  string parameter_name = 1; // Name descriptor of the parameter
  AresValue parameter_value = 2; // Value of the planned parameter
  PlannerMetadata metadata = 3; // Metadata associated with the planned parameter
}

//This is sort of a place holder for now, until we (or atleast I) understand our needs better
message PlannerMetadata {
  string metadata_name = 1;
  string planner_id = 2;
}

enum PlanStatusCode {
  PLAN_STATUS_UNSPECIFIED = 0;
  PLAN_ACCEPTED = 1;
  PLAN_UNACHIEVABLE = 2;
  PLAN_FAILED = 3;
}

enum ObjectiveStatus {
	OBJECTIVE_STATUS_UNSPECIFIED = 0; // A default status
	OBJECTIVE_UNACHIEVED = 1; // The planner has not yet achieved it's desired objective
	OBJECTIVE_ACHIEVED = 2; // The planner has successfully achieved it's objective
	OBJECTIVE_FAILED = 3; // The planner cannot achieve it's objective
}