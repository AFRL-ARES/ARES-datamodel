syntax = "proto3";

package ares.services;

import "connection/connection_state.proto";
import "ares_struct.proto";
import "visualizing/visualizer_info.proto";
import "visualizing/visualizer_settings.proto";
import "google/protobuf/empty.proto";

service AresVisualizerManagementService {
  rpc GetState(datamodel.connection.StateRequest) returns (datamodel.connection.StateResponse);
  rpc GetInfo(VisualizerInfoRequest) returns (VisualizerInfoResponse);
  rpc SetVisualizerSettings(datamodel.analyzing.VisualizerSettings) returns (google.protobuf.Empty);
  rpc GetVisualizerSettings(VisualizerSettingsRequest) returns (datamodel.AresStruct);

  rpc GetAllVisualizers(google.protobuf.Empty) returns (GetAllVisualizersResponse);
  rpc AddRemoteVisualizer(AddRemoteVisualizerRequest) returns (AddRemoteVisualizerResponse);
  rpc UpdateRemoteVisualizer(UpdateRemoteVisualizerRequest) returns (UpdateRemoteVisualizerResponse);
  rpc RemoveRemoteVisualizer(RemoveRemoteVisualizerRequest) returns (google.protobuf.Empty);
}

message GetAllVisualizersResponse {
  repeated datamodel.visualizing.VisualizerInfo visualizers = 1;
}

message AddRemoteVisualizerRequest {
  string name = 1;
  string url = 2;
}

message AddRemoteVisualizerResponse {
  string visualizer_id = 1;
  bool success = 2;
  optional string error_message = 3;
}

message UpdateRemoteVisualizerRequest {
  string visualizer_id = 1;
  optional string name = 2;
  optional string url = 3;
}

message UpdateRemoteVisualizerResponse {
  bool success = 1;
  optional string error_message = 2;
}

message RemoveRemoteVisualizerRequest {
  string visualizer_id = 1;
}

message VisualizerInfoRequest {
  string visualizer_id = 1;
}

message VisualizerInfoResponse {
  datamodel.visualizing.VisualizerInfo info = 1;
}

message VisualizerSettingsRequest {
  string visualizer_id = 1;
}
