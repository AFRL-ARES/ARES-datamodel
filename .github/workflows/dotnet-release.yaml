on:
  release:
    types: [released]
jobs:
  build:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
      - name: Build
        run: dotnet build --configuration Release /p:Version=${VERSION}
        working-directory: dotnet
      - name: Test
        run: dotnet test --configuration Release /p:Version=${VERSION} --no-build
        working-directory: dotnet
      - name: Pack
        run: dotnet pack --configuration Release /p:Version=${VERSION} --no-build --output .
        working-directory: dotnet/ARES.Datamodel
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address
      
      - name: Push
        run: |
          dotnet nuget push Ares.Datamodel.${VERSION}.nupkg \
          --api-key ${{steps.login.outputs.NUGET_API_KEY}} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
        working-directory: dotnet/ARES.Datamodel
