syntax = "proto3";

package ares.datamodel.templates;

import "templates/parameter_metadata.proto";
import "templates/output_metadata.proto";
import "templates/device_category.proto";

message CommandMetadata {
	optional string unique_id = 1; // A unique id for this metadata
	string name = 2; // Name of the command, registered by a device
	string description = 3; // Helpful text describing the command
	string device_id = 4; // Id of the device to lookup for execution/generation of the command
	optional OutputMetadata output_metadata = 5; // provides metadata for the output of this command if there is one. Set to null if the command does not provide an output
	repeated ParameterMetadata parameter_metadatas = 6; // Collection of metadata describing parameters/arguments
	string device_type = 7; // String of the devices class type
	optional DeviceCategory device_category = 8;
	optional string device_driver_id = 9;
	optional string device_driver_version = 10;
}