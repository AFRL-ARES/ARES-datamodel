syntax = "proto3";

package ares.datamodel;

import "analyzing/analyzer_info.proto";
import "analyzing/analysis.proto";

message AnalysisOverview {
    optional string unique_id = 1;
    string experiment_overview_id = 2;
    double result = 3 [deprecated = true];
    analyzing.AnalyzerInfo analyzer_info = 4;
    repeated analyzing.Objective objectives = 5; 
}